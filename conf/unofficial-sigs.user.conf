# clamav-unofficial-sigs: only providers that need no key or registration
user_configuration_complete="yes"

# no clamd in this image: clamscan reads the databases at every run
reload_dbs="no"

# need an account/key
securiteinfo_enabled="no"
malwarepatrol_enabled="no"
malwareexpert_enabled="no"

# duplicate of the signatures LMD already updates by itself
linuxmalwaredetect_enabled="no"

# abuse.ch discontinued the ClamAV file: https://urlhaus.abuse.ch/downloads/urlhaus.ndb returns 410 Gone
urlhaus_enabled="no"
